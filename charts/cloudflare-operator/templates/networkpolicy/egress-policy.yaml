{{- if .Values.features.networkPolicy.enabled }}
# This NetworkPolicy controls egress traffic from the operator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloudflare-operator.fullname" . }}-egress-policy
  namespace: {{ include "cloudflare-operator.namespace" . }}
  labels:
    {{- include "cloudflare-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "cloudflare-operator.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudflare-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS traffic to Cloudflare API
    - to: []
      ports:
        - port: 443
          protocol: TCP
    # Allow HTTP traffic for health checks and internal communication
    - to: []
      ports:
        - port: 80
          protocol: TCP
    # Allow Kubernetes API access
    - to: []
      ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}