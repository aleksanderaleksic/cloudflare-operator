{{- if .Values.features.webhooks.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cloudflare-operator.fullname" . }}-test-webhook"
  namespace: {{ include "cloudflare-operator.namespace" . }}
  labels:
    {{- include "cloudflare-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-webhook
      image: bitnami/kubectl:1.28
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing webhook configuration..."
          
          # Test webhook service exists
          kubectl get service {{ include "cloudflare-operator.webhook.serviceName" . }} -n {{ include "cloudflare-operator.namespace" . }}
          if [ $? -eq 0 ]; then
            echo "✓ Webhook service exists"
          else
            echo "✗ Webhook service not found"
            exit 1
          fi
          
          # Test validating webhook configuration exists
          kubectl get validatingadmissionwebhook {{ include "cloudflare-operator.fullname" . }}-validating-webhook-configuration
          if [ $? -eq 0 ]; then
            echo "✓ Validating webhook configuration exists"
          else
            echo "✗ Validating webhook configuration not found"
            exit 1
          fi
          
          # Test mutating webhook configuration exists
          kubectl get mutatingadmissionwebhook {{ include "cloudflare-operator.fullname" . }}-mutating-webhook-configuration
          if [ $? -eq 0 ]; then
            echo "✓ Mutating webhook configuration exists"
          else
            echo "✗ Mutating webhook configuration not found"
            exit 1
          fi
          
          echo "Webhook tests passed!"
  {{- if .Values.features.rbac.create }}
  serviceAccountName: {{ include "cloudflare-operator.serviceAccountName" . }}
  {{- end }}
{{- end }}