{{- if and .Values.features.certManager.enabled .Values.features.metrics.enabled }}
# The following manifests contain a self-signed issuer CR and a metrics certificate CR.
# More document can be found at https://docs.cert-manager.io
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cloudflare-operator.fullname" . }}-metrics-certs
  namespace: {{ include "cloudflare-operator.namespace" . }}
  labels:
    {{- include "cloudflare-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "cloudflare-operator.annotations" . | nindent 4 }}
spec:
  dnsNames:
  - {{ include "cloudflare-operator.metrics.serviceName" . }}.{{ include "cloudflare-operator.namespace" . }}.svc
  - {{ include "cloudflare-operator.metrics.serviceName" . }}.{{ include "cloudflare-operator.namespace" . }}.svc.cluster.local
  issuerRef:
    kind: {{ .Values.certManager.issuer.kind }}
    name: {{ include "cloudflare-operator.issuer.name" . }}
  secretName: {{ include "cloudflare-operator.fullname" . }}-metrics-server-cert
  {{- if .Values.certManager.certificate.duration }}
  duration: {{ .Values.certManager.certificate.duration }}
  {{- end }}
  {{- if .Values.certManager.certificate.renewBefore }}
  renewBefore: {{ .Values.certManager.certificate.renewBefore }}
  {{- end }}
{{- end }}