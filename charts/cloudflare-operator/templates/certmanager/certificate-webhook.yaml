{{- if .Values.features.certManager.enabled }}
# The following manifests contain a self-signed issuer CR and a certificate CR.
# More document can be found at https://docs.cert-manager.io
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cloudflare-operator.certificate.name" . }}
  namespace: {{ include "cloudflare-operator.namespace" . }}
  labels:
    {{- include "cloudflare-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "cloudflare-operator.annotations" . | nindent 4 }}
spec:
  dnsNames:
  {{- if .Values.certManager.certificate.dnsNames }}
  {{- toYaml .Values.certManager.certificate.dnsNames | nindent 2 }}
  {{- else }}
  - {{ include "cloudflare-operator.webhook.serviceName" . }}.{{ include "cloudflare-operator.namespace" . }}.svc
  - {{ include "cloudflare-operator.webhook.serviceName" . }}.{{ include "cloudflare-operator.namespace" . }}.svc.cluster.local
  {{- end }}
  issuerRef:
    kind: {{ .Values.certManager.issuer.kind }}
    name: {{ include "cloudflare-operator.issuer.name" . }}
  secretName: {{ .Values.certManager.certificate.secretName }}
  {{- if .Values.certManager.certificate.duration }}
  duration: {{ .Values.certManager.certificate.duration }}
  {{- end }}
  {{- if .Values.certManager.certificate.renewBefore }}
  renewBefore: {{ .Values.certManager.certificate.renewBefore }}
  {{- end }}
{{- end }}